name: Issue title lint

# An issue title is written as the heading of a commit, type(scope): description, as described in
# .github/instructions/commit-message.instructions.md. This workflow runs the check of the commit-msg
# hook (.husky/scripts/commit-lint.fsx) against the title of an issue, so the pattern keeps a single
# source. An issue cannot be blocked the way a pull request can: a title that fails the check gets
# the label "needs title" and one comment that names the format, and the label is removed when the
# title passes. An issue with the label "ux" is skipped: the UX / Design template is for users and
# UX designers, and a maintainer renames such an issue at triage.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-title-lint-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-title-lint:
    # An edit that leaves the title as it was needs no new check.
    if: >-
      ${{ !contains(github.event.issue.labels.*.name, 'ux')
      && (github.event.action != 'edited' || github.event.changes.title) }}
    runs-on: ubuntu-latest

    steps:
      # The default branch, never code from the issue: the title is the only input from the reporter.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use .NET Core 10.0 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Lint the issue title
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Passed through the environment and never interpolated into the script: the title is
          # text from the reporter.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          HAS_LABEL: ${{ contains(github.event.issue.labels.*.name, 'needs title') }}
          LABEL: needs title
        run: |
          set -euo pipefail

          tmp=$(mktemp)
          printf '%s\n' "$ISSUE_TITLE" > "$tmp"

          if dotnet fsi .husky/scripts/commit-lint.fsx "$tmp"; then
            if [[ "$HAS_LABEL" == "true" ]]; then
              gh issue edit "$ISSUE_NUMBER" --remove-label "$LABEL"
            fi

            exit 0
          fi

          echo "::warning::The title of issue #$ISSUE_NUMBER is not in the form type(scope): description"

          # The label and the comment are added once, not again on every edit that still fails.
          if [[ "$HAS_LABEL" != "true" ]]; then
            gh label create "$LABEL" --color FBCA04 \
              --description "The issue title is not in the form type(scope): description" \
              --force

            gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL"

            gh issue comment "$ISSUE_NUMBER" --body-file - <<'COMMENT'
          The title of this issue is not in the form the project uses. An issue title is written as the heading of a commit:

          ```
          type(scope): description
          ```

          for example `fix(genorder): the dose quantity of an enteral feeding cannot be set` or `docs: describe the release process`. The types and scopes are listed in [commit-message.instructions.md](https://github.com/informedica/GenPRES/blob/master/.github/instructions/commit-message.instructions.md#issue-titles).

          Edit the title and the `needs title` label is removed. If you are not sure which type or scope fits, leave the title as it is; a maintainer renames the issue at triage.
          COMMENT
          fi
