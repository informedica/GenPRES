name: Build master

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      # Without this, one leg's failure cancels the other two and you cannot tell a
      # platform-specific break from a universal one. Issue #523 failed on ubuntu and
      # reported the macOS and Windows legs only as "The operation was canceled".
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Runner hardware
      # Diagnostic for the macOS leg: GenSOLVER.Tests takes 66s there against 15s on ubuntu and
      # 18s on windows, and nothing in the job log says what each leg actually runs on. Read the
      # core count and RAM off the log rather than assuming the published runner specs.
      shell: bash
      run: |
        echo "arch:  $(uname -m)"
        case "$(uname -s)" in
          Darwin)
            echo "cores: $(sysctl -n hw.ncpu)"
            echo "ram:   $(( $(sysctl -n hw.memsize) / 1073741824 )) GB" ;;
          Linux)
            echo "cores: $(nproc)"
            echo "ram:   $(free -g | awk '/^Mem:/ {print $2}') GB" ;;
          *)
            echo "cores: $(nproc)"
            echo "ram:   $(powershell -NoProfile -Command '[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)') GB" ;;
        esac
    - name: Use .NET Core 10.0 SDK
      # global-json-file (not dotnet-version) so global.json's pinned version + rollForward is the
      # single source of truth for which SDK CI installs — see issue #447: dotnet-version: '10.0.x'
      # let the runner silently install a newer feature band (10.0.302 -> 10.0.400) between two runs,
      # which broke Expecto's reflection-based test discovery. See DEVELOPMENT.md's Toolchain
      # Requirements section for the full incident writeup.
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          .config/dotnet-tools.json
          **/paket.dependencies
          **/paket.references
          **/paket.lock
          Build.fsproj
          GenPRES.sln

    - name: Tool restore
      run: dotnet tool restore

    - name: Format check
      run: dotnet fantomas --check .

    - name: Test execution
      env:
        CI: true
        GENPRES_DEBUG: 1
      run: dotnet run ServerTests

    - name: Check solution version provenance
      # Calls the script directly rather than `dotnet run CheckVersions` so the FAKE target that depends 
      # on Build, which transitively depends on Clean/RestoreClient, so it would redo the full restore/build 
      # which the "Test execution" just did. The DLLs are already fresh from build at this point.
      run: dotnet fsi scripts/CheckSolutionVersions.fsx

    - name: Upload test results
      # The trx files carry per-test durations; only the ubuntu ones were ever read (by the publish
      # step below). Upload all three legs so the macOS GenSOLVER.Tests slowdown can be traced to
      # specific tests. always(): a red run is still data.
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**/*.trx'
        retention-days: 7

    - name: Publish test results
      # continue-on-error: Dependabot PRs (and PRs from forks) get a read-only GITHUB_TOKEN that GitHub forces 
      # regardless of any `permissions:` blocks declared, so this step 403s on those runs. Test results are still
      # in the build log so don't let that fail a good build due to this step.
      if: always() && runner.os == 'Linux'
      continue-on-error: true
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      with:
        files: '**/TestResults/**/*.trx'
