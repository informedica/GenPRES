name: Build master

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Use .NET Core 10.0 SDK
      # global-json-file (not dotnet-version) so global.json's pinned version + rollForward is the
      # single source of truth for which SDK CI installs — see issue #447: dotnet-version: '10.0.x'
      # let the runner silently install a newer feature band (10.0.302 -> 10.0.400) between two runs,
      # which broke Expecto's reflection-based test discovery. See DEVELOPMENT.md's Toolchain
      # Requirements section for the full incident writeup.
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          .config/dotnet-tools.json
          **/paket.dependencies
          **/paket.references
          **/paket.lock
          Build.fsproj
          GenPRES.sln

    - name: Tool restore
      run: dotnet tool restore

    - name: Format check
      run: dotnet fantomas --check .

    - name: Test execution
      env:
        CI: true
        GENPRES_DEBUG: 1
      run: dotnet run ServerTests

    - name: Check solution version provenance
      # Calls the script directly rather than `dotnet run CheckVersions` so the FAKE target that depends 
      # on Build, which transitively depends on Clean/RestoreClient, so it would redo the full restore/build 
      # which the "Test execution" just did. The DLLs are already fresh from build at this point.
      run: dotnet fsi scripts/CheckSolutionVersions.fsx

    - name: Publish test results
      # continue-on-error: Dependabot PRs (and PRs from forks) get a read-only GITHUB_TOKEN that GitHub forces 
      # regardless of any `permissions:` blocks declared, so this step 403s on those runs. Test results are still
      # in the build log so don't let that fail a good build due to this step.
      if: always() && runner.os == 'Linux'
      continue-on-error: true
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      with:
        files: '**/TestResults/**/*.trx'
