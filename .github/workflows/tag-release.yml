name: Tag and Release

# This workflow turns a merged ShipIt release PR into permanent release artifacts: an annotated git tag
# on the merge commit, a GitHub Release with that version's section from CHANGELOG.md, and (issue #459)
# a Docker image published to Docker Hub (docker.io/informedica/genpres) tagged with that same version.
#
# This is a separate workflow, not a job inside build.yml or release.yml. The reason is the same as for
# release.yml: a failure here must not stop the test and format matrix, and it runs on a different event
# (pull_request closed) than release.yml (push to master). See ADR-0005 and issues #470 and #459.
#
# The version number, pre-release flag, and release body all come from scripts/ReleaseNotes.fsx instead 
# of being parsed here. That means this workflow and a local dry run before merging a release PR use the
# same code. The script reads <Version> through
# scripts/Versioning.fsx, which is the same path used by `dotnet run CheckVersions`. Directory.Build.props
# has one parser only (see #447), and the parsing is covered by scripts/ChangelogTests.fsx.
#
# Trigger note: this is not ShipIt's suggested setup. ShipIt's README says to gate a downstream release job:
#     if: startsWith(github.event.head_commit.message, 'chore: release ')
# That condition is false for this repo. Every ShipIt release PR so far (#455, #458, #464) merged as a
# normal merge commit with two parents, so the push event's head_commit.message is:
#    "Merge pull request #NNN from informedica/release/master", not "chore: release ...".
#
# Because all three merge methods remain enabled (ADR-0005, design choice 2), the trigger must work regardless
# of merge method. ShipIt always pushes its release branch as `release/master` and labels the PR 
# `easybuild-release:pending`, so the branch name is the main signal here. The label is the fallback equivalent.

on:
  pull_request:
    types: [ closed ]
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: Tag and publish GitHub Release
    # head.ref is only a branch name, so it must be qualified by the head repository. A merged fork PR
    # with a release/master branch would otherwise trigger tag and release writes. ShipIt only pushes
    # release/master to this repo, so this is enough for a real release PR. The
    # easybuild-release:pending label is not required; it would couple the workflow to a label ShipIt
    # could rename.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/master'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
    - name: Check the merge commit is known
      env:
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        if [ -z "$MERGE_SHA" ]; then
          echo "::error::pull_request.merge_commit_sha is empty, so there is nothing to tag"
          exit 1
        fi

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # The merge commit, not the PR head: this is the state master was actually in when the
        # version shipped, and it stays reachable from master after ShipIt reuses release/master.
        ref: ${{ github.event.pull_request.merge_commit_sha }}

    - name: Use .NET Core 10.0 SDK
      # global-json-file so this stays pinned to the same SDK band as build.yml (see issue #447).
      # No cache: the only thing built here is a dependency-free .fsx, so there is nothing to hit.
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json

    - name: Read release facts from CHANGELOG.md
      id: release
      # Fails loudly when the merged version has no changelog section, is empty, or is
      # duplicated, rather than publishing a wrong release. --github-output sets version, tag,
      # and prerelease for the steps below. Note that `prerelease` is the string "true" or
      # "false"; compare it explicitly, never test it for truthiness in an `if:`.
      run: >-
        dotnet fsi scripts/ReleaseNotes.fsx
        --out "$RUNNER_TEMP/release-notes.md"
        --github-output

    - name: Create annotated tag
      env:
        TAG: ${{ steps.release.outputs.tag }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      # Reuse a tag only when it points to this merge commit; otherwise fail. The Release step must
      # still run so a re-run can recover when the tag was pushed but the Release was not created.
      run: |
        set -euo pipefail
        # Annotated tags live at refs/tags/X, while refs/tags/X^{} resolves to the tagged commit.
        # Check the peeled ref first, then fall back to a lightweight tag.
        existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
        if [ -z "$existing" ]; then
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
        fi
        if [ -n "$existing" ]; then
          if [ "$existing" = "$MERGE_SHA" ]; then
            echo "::notice::Tag $TAG already points at $MERGE_SHA, leaving it alone"
            exit 0
          fi
          echo "::error::Tag $TAG already exists and points at $existing, not this release's merge commit $MERGE_SHA"
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "GenPRES $TAG (release PR #${{ github.event.pull_request.number }})"
        git push origin "refs/tags/$TAG"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
        PRERELEASE: ${{ steps.release.outputs.prerelease }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::notice::Release $TAG already exists, leaving it alone"
          exit 0
        fi
        flags=()
        if [ "$PRERELEASE" = "true" ]; then
          flags+=(--prerelease)
        fi
        # --verify-tag: fail rather than silently creating a lightweight tag if the tag push above
        # was skipped or failed. The tag must already exist and be the annotated one.
        gh release create "$TAG" \
          --verify-tag \
          --title "$TAG" \
          --notes-file "$RUNNER_TEMP/release-notes.md" \
          ${flags[@]+"${flags[@]}"}
        echo "Published [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

  build-docker-image:
    name: Build and smoke test Docker image (${{ matrix.arch }})
    # Runs after tag-and-release so it only fires for a real, verified release, and so it can reuse
    # that job's version/tag/prerelease facts instead of re-deriving them from CHANGELOG.md a second
    # time. The image is published to Docker Hub as `docker.io/informedica/genpres` (issue #459) for
    # linux/amd64 and linux/arm64 (issue #1686).
    #
    # One leg per architecture, each on a runner of that architecture, so both images are built and
    # tested natively, with no QEMU emulation. A multi-platform build cannot be loaded into the local
    # daemon, and both checks below need a loaded image to `docker run`. Each leg therefore builds a
    # single-platform image, runs the checks, and hands the image to publish-docker-image as an
    # artifact. This job pushes nothing and needs no registry login: only publish-docker-image
    # pushes, and it starts only when every leg passed, so a failed check on either architecture
    # publishes no tag at all.
    #
    # `docker build` stays CLI, matching how Build.fs's DockerBuild/DockerRun drive Docker everywhere
    # else. `--platform` needs no buildx setup action, both runner images ship Docker Buildx.
    needs: tag-and-release
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      # Both architectures are published together or not at all, so there is no point finishing one
      # leg once the other failed.
      fail-fast: true
      matrix:
        include:
        - arch: amd64
          platform: linux/amd64
          runner: ubuntu-latest
        - arch: arm64
          platform: linux/arm64
          # GitHub-hosted arm64 runner, free for public repositories.
          runner: ubuntu-24.04-arm

    env:
      # A local name only; publish-docker-image gives the image its Docker Hub tags.
      IMAGE: genpres-release:${{ matrix.arch }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # Same merge commit tag-and-release tagged, so the image matches the tagged source exactly.
        ref: ${{ github.event.pull_request.merge_commit_sha }}

    - name: Build image
      # Same shape as buildDockerImage in Build.fs (the local `DockerBuild` target). The platform is
      # named explicitly even though it matches the runner, so a runner label that resolves to
      # another architecture fails here instead of publishing a mislabelled image.
      env:
        PLATFORM: ${{ matrix.platform }}
        VERSION: ${{ needs.tag-and-release.outputs.version }}
      run: docker build --platform "$PLATFORM" --build-arg "APP_VERSION=$VERSION" -t "$IMAGE" .

    - name: Smoke test the built image
      env:
        # Public demo spreadsheet ID from .env.example. The image now defaults to demo mode with this
        # same ID baked in (#541), so neither -e is strictly required any more; both are still passed
        # so the test also proves that runtime injection of the two variables keeps working.
        DEMO_URL_ID: 1IZ3sbmrM4W4OuSYELRmCkdxpN9SlBI-5TLSvXWhHVmA
      # There is no dedicated health endpoint (see DEVELOPMENT.md), so "/" is the only smoke-test target
      # available. This does not exercise medication calculations; it only proves the image starts and serves.
      run: |
        set -euo pipefail
        password=$(openssl rand -base64 24)
        container=$(docker run -d -p 8085:8085 \
          -e GENPRES_URL_ID="$DEMO_URL_ID" \
          -e GENPRES_PASSWORD="$password" \
          "$IMAGE")
        cleanup() {
          docker logs "$container" || true
          docker rm -f "$container" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        for _ in $(seq 1 30); do
          if curl -sf -o /dev/null http://localhost:8085/; then
            echo "Smoke test passed: / returned 200"
            exit 0
          fi
          sleep 2
        done

        echo "::error::Smoke test failed: / did not return 200 within 60s of container start"
        exit 1

    - name: Check that a refused start-up exits the container
      # The smoke test above cannot see issue #572: a container that never exits after the server
      # refuses to start looks exactly like one that is still starting. This starts the image with a
      # configuration the server refuses (production mode with a password shorter than 16
      # characters; a missing password no longer refuses since #590, it starts with admin
      # operations disabled) and requires the container to exit with code 1: the controlled
      # refusal in `main`, not the 134 of an unhandled exception, so the check proves both that
      # PID 1 (tini) passes the exit on and that the server took its documented exit path.
      run: |
        set -euo pipefail
        container=$(docker run -d -e GENPRES_PROD=1 -e GENPRES_PASSWORD=short "$IMAGE")
        cleanup() {
          docker logs "$container" || true
          docker rm -f "$container" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        if ! code=$(timeout 30 docker wait "$container"); then
          echo "::error::Container still running 30s after a refused start-up (issue #572)"
          exit 1
        fi
        if [ "$code" -ne 1 ]; then
          echo "::error::Refused start-up exited $code; expected exit code 1"
          exit 1
        fi
        echo "Refusal check passed: container exited $code"

    - name: Save image
      # The tested image itself is handed on, so publish-docker-image pushes exactly what passed the
      # checks above and nothing is built twice.
      run: docker save "$IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"

    - name: Upload image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docker-image-${{ matrix.arch }}
        path: ${{ runner.temp }}/image.tar.gz
        # Already gzipped; a second compression pass only costs time.
        compression-level: 0
        # publish-docker-image reads it within the same run; nothing needs it after that.
        retention-days: 1
        # A re-run of a job is the same run: without this, "Re-run jobs" fails at this step with a
        # name conflict. The re-run's image replaces the earlier attempt's.
        overwrite: true

  publish-docker-image:
    name: Publish multi-arch Docker image
    # Starts only when tag-and-release and every build-docker-image leg passed. It loads the tested
    # images, pushes each under an architecture tag, and then joins them in one manifest list under
    # the release tags, so `docker pull informedica/genpres:<version>` picks the host's architecture.
    #
    # Auth is Docker Hub OIDC, so there is no stored registry credential: docker/login-action
    # exchanges the job's GitHub OIDC token for a short-lived Docker Hub token, gated by a ruleset on
    # the `DOCKERHUB_OIDC_CONNECTIONID` connection in Docker Home. The ruleset is scoped to the
    # `docker-publish` GitHub environment below, so the OIDC subject is
    # `repo:informedica/GenPRES:environment:docker-publish` — a plain `pull_request` subject would
    # let any PR's workflow mint a push token. This is the only job that pushes, so it is the only
    # job that needs the environment. Setup: DEVELOPMENT.md § Publishing the Docker image.
    #
    # docker/login-action is the one marketplace action here — the OIDC token exchange lives in it
    # and cannot be done with plain `docker login`. `docker push` and `docker buildx imagetools`
    # stay CLI; the actions/*-artifact steps are GitHub's own, as in build.yml.
    needs: [ tag-and-release, build-docker-image ]
    runs-on: ubuntu-latest

    # A GitHub Actions environment, so the OIDC subject claim carries `environment:docker-publish`
    # for the Docker Hub ruleset to match. Add required reviewers to this environment in repo
    # settings if a manual gate before each Docker Hub push is wanted.
    environment: docker-publish

    # id-token: write lets the job request a GitHub OIDC token for the Docker Hub exchange. No
    # contents scope: the job does not check out the repository, and downloading an artifact of the
    # same run needs no token permission. No packages/write scope: the push goes to Docker Hub, not
    # GHCR.
    permissions:
      id-token: write

    env:
      IMAGE_NAME: docker.io/informedica/genpres

    steps:
    - name: Download images
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: docker-image-*
        path: ${{ runner.temp }}/images

    - name: Log in to Docker Hub via OIDC
      # No password: docker/login-action reads DOCKERHUB_OIDC_CONNECTIONID, requests a GitHub OIDC
      # token, and exchanges it for a short-lived Docker Hub token. `username` is the Docker Hub org
      # name. DOCKERHUB_OIDC_CONNECTIONID is a repo *variable* (not a secret — it is an identifier,
      # useless without a matching ruleset), set from the connection created in Docker Home.
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: informedica
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

    - name: Determine image tags
      id: tags
      env:
        VERSION: ${{ needs.tag-and-release.outputs.version }}
        # String "true"/"false" from ReleaseNotes.fsx's %b formatter, not a YAML/shell boolean;
        # compare it explicitly, same rule as the Create GitHub Release step above.
        PRERELEASE: ${{ needs.tag-and-release.outputs.prerelease }}
      # :latest only moves on a stable release. Every release shipped so far is a pre-release
      # (0.1.2-alpha.N), so :latest stays unset until the first stable version ships.
      run: |
        set -euo pipefail
        # scripts/Versioning.fsx's isPreRelease explicitly allows SemVer build metadata
        # (a "+..." suffix) in <Version>, even though no release has used one yet. Docker tags
        # can't contain "+" (grammar is [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}), so a version like
        # 1.0.0+build.7 would otherwise produce a tag Docker rejects, after the Git tag and
        # GitHub Release for that version already exist. Fold "+" to "-" so the image tag always
        # stays valid.
        docker_version="${VERSION//+/-}"
        echo "docker_version=$docker_version" >> "$GITHUB_OUTPUT"
        {
          echo "tags<<EOF"
          echo "$IMAGE_NAME:$docker_version"
          if [ "$PRERELEASE" = "false" ]; then
            echo "$IMAGE_NAME:latest"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Push architecture images
      # A manifest list can only reference images that are already in the registry, so each tested
      # image is pushed first under its own tag, <version>-<arch>. Those tags stay on Docker Hub
      # and let a user pin one architecture.
      env:
        DOCKER_VERSION: ${{ steps.tags.outputs.docker_version }}
      run: |
        set -euo pipefail
        for arch in amd64 arm64; do
          gunzip -c "$RUNNER_TEMP/images/docker-image-$arch/image.tar.gz" | docker load
          arch_tag="$IMAGE_NAME:$DOCKER_VERSION-$arch"
          docker tag "genpres-release:$arch" "$arch_tag"
          docker push "$arch_tag"
          echo "Published \`$arch_tag\`" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Publish multi-arch manifest
      # One manifest list over both architecture images, under every release tag. imagetools
      # works in the registry only, so the images are not pulled or rebuilt.
      env:
        DOCKER_VERSION: ${{ steps.tags.outputs.docker_version }}
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        set -euo pipefail
        tag_args=()
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          tag_args+=(-t "$tag")
        done <<< "$TAGS"
        docker buildx imagetools create "${tag_args[@]}" \
          "$IMAGE_NAME:$DOCKER_VERSION-amd64" \
          "$IMAGE_NAME:$DOCKER_VERSION-arm64"
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          docker buildx imagetools inspect "$tag"
          echo "Published \`$tag\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
        done <<< "$TAGS"
